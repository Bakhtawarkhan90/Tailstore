services:

  database:
    image: mysql:8.0
    container_name: database
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - tailstore_mysql_data:/var/lib/mysql
    networks:
      - tailstore

  flask_app:
    build: .
    container_name: tailstore
    image: bakhtawar375/tailstore:latest
    env_file:
      - .env
    ports:
      - "5000:5000"
    networks:
      - tailstore
    depends_on:
      - database
    restart: unless-stopped

volumes:
  tailstore_mysql_data:

networks:
  tailstore:
